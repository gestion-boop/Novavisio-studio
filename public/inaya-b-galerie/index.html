<style>
:root{--t:#a04c34;--td:#7a3a28;--cream:#f6ead9;--ink:#3a2a22;--muted:#7d6558}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#fcf3e8 0%,#f3e2cf 55%,#e9cfb5 100%) fixed;line-height:1.55;overflow-x:clip}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:44px 0 28px}
.logo{width:min(46vw,210px);height:auto;border-radius:50%;margin:0 auto 18px;box-shadow:0 14px 34px rgba(120,60,40,.28),0 0 0 5px rgba(160,76,52,.16)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(1.6rem,4.6vw,2.6rem);color:var(--td);letter-spacing:.02em}
.sub{color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;margin-top:6px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.tags span{padding:6px 14px;border-radius:99px;background:rgba(160,76,52,.1);color:var(--td);font-weight:600;font-size:.86rem}
.info{margin-top:18px;color:var(--muted);font-size:.93rem}
.info a{color:var(--td);font-weight:700;text-decoration:none}
.gal{columns:4 230px;column-gap:14px;padding:14px 0 54px}
.p{break-inside:avoid;margin:0 0 14px;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#e9cfb5;box-shadow:0 8px 22px rgba(120,60,40,.16);position:relative}
.p img{width:100%;height:auto;transition:transform .5s}
.p:hover img{transform:scale(1.04)}
.p:focus-visible{outline:3px solid var(--t);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 18px 40px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(40,22,16,.94);display:grid;place-items:center;padding:60px 64px}
.lb[hidden]{display:none}
.lb img{cursor:zoom-out;max-height:84vh;max-width:100%;border-radius:12px;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.8rem;cursor:pointer;line-height:1}
.lb button:hover{background:var(--t)}
.lb-x{top:14px;left:50%;transform:translateX(-50%)}
.lb-p{left:12px;top:50%}.lb-n{right:12px;top:50%}
@media(max-width:600px){.lb{padding:64px 8px}.lb-p,.lb-n{top:auto;bottom:14px}}
/* nv-lang-css */
.nv-langbar{position:fixed;top:12px;right:12px;z-index:80;display:flex;gap:6px;padding:6px 8px;border-radius:99px;background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nv-langbar button{width:32px;height:22px;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;cursor:pointer;background:none;opacity:.65;transition:opacity .15s,transform .15s}
.nv-langbar button:hover{opacity:1;transform:scale(1.08)}
.nv-langbar button[aria-pressed="true"]{border-color:#fff;opacity:1}
.nv-langbar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.nv-langbar svg{width:100%;height:100%;display:block}
/* /nv-lang-css */
</style>
</head>

<div class="lb" id="lb" hidden>
  <button class="lb-p" id="lbp" aria-label="Précédent">‹</button>
  <button class="lb-n" id="lbn" aria-label="Suivant">›</button>
  <img id="lbi" alt="">
</div>
<script>
{
  const g=[...document.querySelectorAll('.p')],lb=document.getElementById('lb'),li=document.getElementById('lbi');let k=0;
  const show=n=>{k=(n+g.length)%g.length;const im=g[k].querySelector('img');li.src=im.src;li.alt=im.alt;lb.hidden=false};
  g.forEach((f,i)=>{f.addEventListener('click',()=>show(i));f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
  document.getElementById('lbp').onclick=()=>show(k-1);document.getElementById('lbn').onclick=()=>show(k+1);
  lb.addEventListener('click',e=>{if(!e.target.closest('.lb-p,.lb-n'))lb.hidden=true});
  document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
}
</script>
<script id="nv-lang">
(function(){
 const FL={
  fr:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ef4135"/></svg>',
  en:'<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#c8102e" stroke-width="3"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></svg>',
  es:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#aa151b"/><rect y=".5" width="3" height="1" fill="#f1bf00"/></svg>',
  de:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#000"/><rect y=".667" width="3" height="1.333" fill="#dd0000"/><rect y="1.333" width="3" height=".667" fill="#ffce00"/></svg>',
  nl:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#ae1c28"/><rect y=".667" width="3" height=".667" fill="#fff"/><rect y="1.333" width="3" height=".667" fill="#21468b"/></svg>',
  it:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>'};
 const NAMES={fr:'Français',en:'English',es:'Español',de:'Deutsch',nl:'Nederlands',it:'Italiano'};
 window.NVLang=function(D,onChange){
  const q=new URLSearchParams(location.search),all=Object.keys(D);
  /* ?langs=fr,en limite les langues proposées ; ?lang=xx impose la langue de départ (sinon langue du navigateur) */
  const allowed=(q.get('langs')||'').split(',').map(x=>x.trim().toLowerCase()).filter(x=>D[x]);
  const list=allowed.length?allowed:all,nav=(navigator.language||'fr').slice(0,2).toLowerCase();
  let cur=list.includes(q.get('lang'))?q.get('lang'):list.includes(nav)?nav:list[0];
  const bar=document.createElement('div');bar.className='nv-langbar';bar.setAttribute('role','group');bar.setAttribute('aria-label','Langue');
  function apply(k){cur=k;document.documentElement.lang=k;const d=D[k];
   document.querySelectorAll('[data-i]').forEach(e=>{const v=d[e.dataset.i];if(v!==undefined)e.textContent=v});
   document.querySelectorAll('[data-ih]').forEach(e=>{const v=d[e.dataset.ih];if(v!==undefined)e.innerHTML=v});
   document.querySelectorAll('[data-ia]').forEach(e=>e.dataset.ia.split(';').forEach(pair=>{const [a,key]=pair.split(':'),v=d[key];if(v!==undefined)e.setAttribute(a,v)}));
   if(d._title)document.title=d._title;
   [...bar.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));
   if(onChange)onChange(k,d);}
  if(list.length>1)list.forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.title=NAMES[k];b.setAttribute('aria-label',NAMES[k]);b.innerHTML=FL[k];b.onclick=()=>apply(k);bar.appendChild(b)});
  document.body.appendChild(bar);apply(cur);
 };
})();

NVLang({"fr": {"_title": "Inaya.B – Galerie", "sub": "Bijoux & accessoires féminins", "addr": "Place des 4 Fontaines, Narbonne · Mardi – samedi, 10h–19h"}, "en": {"_title": "Inaya.B – Gallery", "sub": "Women’s jewellery & accessories", "addr": "Place des 4 Fontaines, Narbonne · Tuesday – Saturday, 10 am – 7 pm"}, "es": {"_title": "Inaya.B – Galería", "sub": "Joyas y accesorios femeninos", "addr": "Place des 4 Fontaines, Narbona · Martes – sábado, 10:00 – 19:00"}, "de": {"_title": "Inaya.B – Galerie", "sub": "Schmuck & Damenaccessoires", "addr": "Place des 4 Fontaines, Narbonne · Dienstag – Samstag, 10 – 19 Uhr"}});
</script>
