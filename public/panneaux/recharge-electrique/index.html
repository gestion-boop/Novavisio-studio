<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#224A95">
<title>Recharge électrique · Camping Figurotta</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#224A95}
.top{display:flex;align-items:center;justify-content:flex-end;padding:10px 16px;background:#fff;border-bottom:4px solid #98C05B}
.langs{display:flex;gap:6px;padding:4px;border:1px solid #224A9533;border-radius:999px;background:#E1C88644}
.langs button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;background:none;overflow:hidden;opacity:.75;cursor:pointer;transition:opacity .2s,transform .15s}
.langs button:hover{opacity:1;transform:scale(1.08)}.langs button[aria-pressed=true]{opacity:1;border-color:#224A95;box-shadow:0 0 0 2px #98C05B}
.langs svg{width:100%;height:100%;display:block;border-radius:50%}
main{flex:1;display:grid;place-items:center;padding:20px 14px}
.sign{width:min(720px,100%);border-radius:26px;overflow:hidden;background:#224A95;border:4px solid #E1C886;box-shadow:0 18px 50px #0006;text-align:center}
.logo{background:#fff;padding:14px 10px 42px;border-bottom:4px solid #98C05B}.logo img{display:block;margin:0 auto;height:clamp(110px,24vw,170px);width:auto}
.in{padding:0 24px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bolt{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#98C05B;color:#224A95;font-size:34px;margin-top:-37px;border:4px solid #224A95;position:relative}
h1{margin:4px 0 0;font:700 clamp(28px,6vw,44px)/1.1 "Open Sans",system-ui,sans-serif;color:#fff}
.line{width:90px;height:4px;border-radius:4px;background:#98C05B}
p{margin:0;font-size:clamp(17px,2.6vw,22px);color:#fff}
.ask{margin-top:6px;padding:12px 22px;border-radius:14px;background:#E1C886;color:#224A95;font-weight:800;font-size:clamp(17px,2.6vw,22px);box-shadow:0 4px 14px #0004}
</style>
</head>
<body>
<header class="top"><div class="langs" id="langs" role="group" aria-label="Langue"></div></header>
<main><article class="sign"><div class="logo"><img src="../img/figurotta-logo.png" alt="Camping Figurotta"></div><div class="in"><div class="bolt" aria-hidden="true">⚡</div><h1 id="t"></h1><div class="line"></div><p id="a"></p><div class="ask" id="b"></div></div></article></main>
<script>
(function(){
  var NAMES={fr:'Français',en:'English',es:'Español',de:'Deutsch',nl:'Nederlands'};
  var FLAGS={
    fr:'<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="20" height="60" fill="#0055A4"/><rect x="20" width="20" height="60" fill="#fff"/><rect x="40" width="20" height="60" fill="#EF4135"/></svg>',
    en:'<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#012169"/><path d="M0 0L60 60M60 0L0 60" stroke="#fff" stroke-width="10"/><path d="M0 0L60 60M60 0L0 60" stroke="#C8102E" stroke-width="4"/><path d="M30 0V60M0 30H60" stroke="#fff" stroke-width="16"/><path d="M30 0V60M0 30H60" stroke="#C8102E" stroke-width="9"/></svg>',
    es:'<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="60" fill="#AA151B"/><rect y="15" width="60" height="30" fill="#F1BF00"/></svg>',
    de:'<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="20" fill="#000"/><rect y="20" width="60" height="20" fill="#DD0000"/><rect y="40" width="60" height="20" fill="#FFCE00"/></svg>',
    nl:'<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice"><rect width="60" height="20" fill="#AE1C28"/><rect y="20" width="60" height="20" fill="#fff"/><rect y="40" width="60" height="20" fill="#21468B"/></svg>'
  };
  var TXT={"fr": ["Recharge électrique disponible", "Une borne de recharge pour véhicules électriques est à votre disposition.", "Merci de vous renseigner à l’accueil."], "en": ["Electric charging available", "An electric vehicle charging point is available.", "Please ask at reception for information."], "es": ["Recarga eléctrica disponible", "Hay un punto de recarga para vehículos eléctricos a su disposición.", "Por favor, infórmese en la recepción."], "de": ["Elektro-Ladestation verfügbar", "Eine Ladestation für Elektrofahrzeuge steht Ihnen zur Verfügung.", "Bitte erkundigen Sie sich an der Rezeption."], "nl": ["Elektrisch opladen mogelijk", "Er is een oplaadpunt voor elektrische voertuigen beschikbaar.", "Informeer bij de receptie."]};
  var q=new URLSearchParams(location.search);
  var avail=(q.get('langs')||'').split(',').filter(function(l){return NAMES[l];});
  if(!avail.length)avail=Object.keys(NAMES);
  var lang=q.get('lang');
  if(!NAMES[lang]||avail.indexOf(lang)<0){try{lang=localStorage.getItem('nvstudio-visitor-lang');}catch(e){}}
  if(!NAMES[lang]||avail.indexOf(lang)<0)lang=avail[0];
  var box=document.getElementById('langs');
  function set(l){
    lang=l;document.documentElement.lang=l;
    document.getElementById('t').textContent=TXT[l][0];document.getElementById('a').textContent=TXT[l][1];document.getElementById('b').textContent=TXT[l][2];
    document.title=TXT[l][0]+' · Camping Figurotta';
    [].forEach.call(box.children,function(b){b.setAttribute('aria-pressed',b.dataset.lang===l?'true':'false');});
  }
  avail.forEach(function(l){var b=document.createElement('button');b.type='button';b.dataset.lang=l;b.innerHTML=FLAGS[l];b.title=NAMES[l];b.setAttribute('aria-label',NAMES[l]);b.onclick=function(){set(l);};box.appendChild(b);});
  if(avail.length<2)box.style.display='none';
  set(lang);
})();
</script>
</body>
</html>
