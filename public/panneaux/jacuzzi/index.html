<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#224A95">
<title>Jacuzzi · Camping Figurotta</title>
<meta name="description" content="Consignes du cottage, jacuzzi, plancha, sauna">
<link rel="stylesheet" href="../assets/panneaux.css">

body[data-only]{background:#224A95}

body[data-only] .panel{border:4px solid #E1C886;box-shadow:0 18px 50px #0006}

</head>
<body data-only="jacuzzi" data-base="../">

  <img class="logo-h" src="../img/figurotta-logo.png" alt="Camping Figurotta">
  <div class="crumb" id="crumb"></div>
  <div class="langs" id="langs" role="group" aria-label="Langue"></div>
</header>
<main id="app"></main>
<div class="lb" id="lb"><button type="button" id="lbx" aria-label="Fermer">×</button><img alt=""></div>
