<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.T Auto Service – Galerie</title>
<meta name="description" content="Galerie photo de G.T Auto Service, garage indépendant toutes marques à Narbonne : mécanique, carrosserie, peinture.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#B43846;--ink:#212725;--muted:#5d6562;--bg:#f6f5f3;--line:#e6e3df}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow-x:clip}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff;padding:36px 0;text-align:center}
header img{height:72px;width:auto;background:#fff;border-radius:12px;padding:6px 10px;margin:0 auto 14px}
header p{color:#d6dbd9;font-size:.95rem}
section{padding:56px 0 72px}
.kicker{color:var(--red);font-weight:700;font-size:.85rem;margin-bottom:8px}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800;line-height:1.12;margin-bottom:12px}
.sub{color:var(--muted);max-width:720px;margin-bottom:34px;font-size:1.03rem}
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:14px}
.gi{position:relative;margin:0;border-radius:16px;overflow:hidden;cursor:zoom-in;background:var(--ink);grid-row:span 2}
.gi.w{grid-column:span 2}
.gi.f{grid-column:span 4}
.gi:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.gi.f img{object-position:50% 62%}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gi:hover img{transform:scale(1.05)}
.gi figcaption{position:absolute;inset:auto 0 0 0;padding:44px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(20,24,23,.88));display:grid;gap:2px}
.gi small{color:#f3b7bf;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.gi b{font-size:1.05rem;line-height:1.25}
.gi span{font-size:.85rem;color:#d6dbd9;max-height:0;overflow:hidden;transition:max-height .3s}
.gi:hover span,.gi:focus-visible span{max-height:5em}
@media(max-width:860px){.gal{grid-template-columns:repeat(2,1fr);grid-auto-rows:190px}.gi.w{grid-column:span 2}.gi span{max-height:5em}}
@media(max-width:480px){.gal{grid-template-columns:1fr;grid-auto-rows:260px}.gi.w,.gi.f{grid-column:auto}}
.lb{position:fixed;inset:0;z-index:100;background:rgba(15,18,17,.94);display:grid;place-items:center;padding:56px 64px}
.lb[hidden]{display:none}
.lb figure{max-width:min(1000px,100%);max-height:100%;display:grid;gap:12px;justify-items:center;color:#fff;text-align:center}
.lb img{cursor:zoom-out;max-height:72vh;max-width:100%;border-radius:12px;object-fit:contain}
.lb figcaption{font-size:.95rem;color:#d6dbd9}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.8rem;cursor:pointer;line-height:1}
.lb button:hover{background:var(--red)}
.lb-x{top:14px;left:50%;transform:translateX(-50%)}
.lb-p{left:12px;top:50%}.lb-n{right:12px;top:50%}
@media(max-width:600px){.lb{padding:64px 10px}.lb-p,.lb-n{top:auto;bottom:14px}}
footer{padding:0 0 36px;text-align:center;color:var(--muted);font-size:.85rem}
/* nv-lang-css */
.nv-langbar{position:fixed;top:12px;right:12px;z-index:80;display:flex;gap:6px;padding:6px 8px;border-radius:99px;background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nv-langbar button{width:32px;height:22px;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;cursor:pointer;background:none;opacity:.65;transition:opacity .15s,transform .15s}
.nv-langbar button:hover{opacity:1;transform:scale(1.08)}
.nv-langbar button[aria-pressed="true"]{border-color:#fff;opacity:1}
.nv-langbar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.nv-langbar svg{width:100%;height:100%;display:block}
/* /nv-lang-css */
</style>
</head>
<body>
<header><img src="assets/img/logo.png" alt="G.T Auto Service"><p data-i="hdr">Garage indépendant · Narbonne · Toutes marques</p></header>
<section id="galerie">
  <div class="wrap">
    <div class="kicker" data-i="kick">Galerie</div>
    <h2 data-i="h2">Le garage en images.</h2>
    <p class="sub" data-i="sub">Mécanique, carrosserie, peinture : un seul interlocuteur, toutes marques, à Narbonne.</p>
    <div class="gal">
      <figure class="gi w" data-i="0" tabindex="0" role="button" aria-label="Agrandir : Révision et entretien"><img src="assets/img/galerie/moteur.jpg" alt="Révision et entretien" loading="lazy"><figcaption><small data-i="k1">Mécanique</small><b data-i="t1">Révision et entretien</b><span data-i="d1">Vidange, filtres, niveaux : l’atelier intervient selon les préconisations du carnet d’entretien.</span></figcaption></figure>
      <figure class="gi t" data-i="1" tabindex="0" role="button" aria-label="Agrandir : Lustrage et polissage"><img src="assets/img/galerie/polissage.jpg" alt="Lustrage et polissage" loading="lazy"><figcaption><small data-i="k2">Carrosserie</small><b data-i="t2">Lustrage et polissage</b><span data-i="d2">Un rendu brillant et uniforme, avec des finitions professionnelles.</span></figcaption></figure>
      <figure class="gi t" data-i="2" tabindex="0" role="button" aria-label="Agrandir : Un atelier équipé"><img src="assets/img/galerie/cles.jpg" alt="Un atelier équipé" loading="lazy"><figcaption><small data-i="k3">Atelier</small><b data-i="t3">Un atelier équipé</b><span data-i="d3">Équipé pour toutes les interventions mécaniques, de la vidange à la panne moteur difficile à identifier.</span></figcaption></figure>
      <figure class="gi t" data-i="3" tabindex="0" role="button" aria-label="Agrandir : Peinture complète ou partielle"><img src="assets/img/galerie/cabine.jpg" alt="Peinture complète ou partielle" loading="lazy"><figcaption><small data-i="k4">Peinture</small><b data-i="t4">Peinture complète ou partielle</b><span data-i="d4">Raccords et retouches aux teintes constructeurs, de l’apprêt aux finitions.</span></figcaption></figure>
      <figure class="gi w" data-i="4" tabindex="0" role="button" aria-label="Agrandir : Un accrochage ? On s’occupe de tout"><img src="assets/img/galerie/sinistre.jpg" alt="Un accrochage ? On s’occupe de tout" loading="lazy"><figcaption><small data-i="k5">Sinistre</small><b data-i="t5">Un accrochage ? On s’occupe de tout</b><span data-i="d5">Évaluation des dommages, devis gratuit, relation avec votre assureur et véhicule de courtoisie.</span></figcaption></figure>
      <figure class="gi t" data-i="5" tabindex="0" role="button" aria-label="Agrandir : Moteur et diagnostic"><img src="assets/img/galerie/diagnostic.jpg" alt="Moteur et diagnostic" loading="lazy"><figcaption><small data-i="k6">Moteur</small><b data-i="t6">Moteur et diagnostic</b><span data-i="d6">Recherche de pannes, injecteurs, bougies, turbo : on identifie la panne avant d’intervenir.</span></figcaption></figure>
      <figure class="gi f" data-i="6" tabindex="0" role="button" aria-label="Agrandir : Citadines, SUV, utilitaires"><img src="assets/img/galerie/atelier.jpg" alt="Citadines, SUV, utilitaires" loading="lazy"><figcaption><small data-i="k7">Toutes marques</small><b data-i="t7">Citadines, SUV, utilitaires</b><span data-i="d7">Un garage indépendant à Narbonne, pour tous les véhicules, diesel comme essence.</span></figcaption></figure>
    </div>
  </div>
</section>

<div class="lb" id="lb" hidden>
  <button class="lb-p" id="lbp" aria-label="Précédent">‹</button>
  <button class="lb-n" id="lbn" aria-label="Suivant">›</button>
  <figure><img id="lbi" alt=""><figcaption id="lbc"></figcaption></figure>
</div>

<footer>© G.T Auto Service · Visite immersive by NovaVisio</footer>
<script>
{
  const g=[...document.querySelectorAll('.gi')],lb=document.getElementById('lb'),li=document.getElementById('lbi'),lc=document.getElementById('lbc');let k=0;
  const show=n=>{k=(n+g.length)%g.length;const f=g[k];li.src=f.querySelector('img').src;li.alt=f.querySelector('img').alt;lc.textContent=f.querySelector('b').textContent+' — '+f.querySelector('span').textContent;lb.hidden=false};
  g.forEach((f,i)=>{f.addEventListener('click',()=>show(i));f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
  document.getElementById('lbp').onclick=()=>show(k-1);document.getElementById('lbn').onclick=()=>show(k+1);
  lb.addEventListener('click',e=>{if(!e.target.closest('.lb-p,.lb-n'))lb.hidden=true});
  document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
}
</script>
<script id="nv-lang">
(function(){
 const FL={
  fr:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ef4135"/></svg>',
  en:'<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#c8102e" stroke-width="3"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></svg>',
  es:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#aa151b"/><rect y=".5" width="3" height="1" fill="#f1bf00"/></svg>',
  de:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#000"/><rect y=".667" width="3" height="1.333" fill="#dd0000"/><rect y="1.333" width="3" height=".667" fill="#ffce00"/></svg>',
  nl:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#ae1c28"/><rect y=".667" width="3" height=".667" fill="#fff"/><rect y="1.333" width="3" height=".667" fill="#21468b"/></svg>',
  it:'<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>'};
 const NAMES={fr:'Français',en:'English',es:'Español',de:'Deutsch',nl:'Nederlands',it:'Italiano'};
 window.NVLang=function(D,onChange){
  const q=new URLSearchParams(location.search),all=Object.keys(D);
  /* ?langs=fr,en limite les langues proposées ; ?lang=xx impose la langue de départ (sinon langue du navigateur) */
  const allowed=(q.get('langs')||'').split(',').map(x=>x.trim().toLowerCase()).filter(x=>D[x]);
  const list=allowed.length?allowed:all,nav=(navigator.language||'fr').slice(0,2).toLowerCase();
  let cur=list.includes(q.get('lang'))?q.get('lang'):list.includes(nav)?nav:list[0];
  const bar=document.createElement('div');bar.className='nv-langbar';bar.setAttribute('role','group');bar.setAttribute('aria-label','Langue');
  function apply(k){cur=k;document.documentElement.lang=k;const d=D[k];
   document.querySelectorAll('[data-i]').forEach(e=>{const v=d[e.dataset.i];if(v!==undefined)e.textContent=v});
   document.querySelectorAll('[data-ih]').forEach(e=>{const v=d[e.dataset.ih];if(v!==undefined)e.innerHTML=v});
   document.querySelectorAll('[data-ia]').forEach(e=>e.dataset.ia.split(';').forEach(pair=>{const [a,key]=pair.split(':'),v=d[key];if(v!==undefined)e.setAttribute(a,v)}));
   if(d._title)document.title=d._title;
   [...bar.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));
   if(onChange)onChange(k,d);}
  if(list.length>1)list.forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.title=NAMES[k];b.setAttribute('aria-label',NAMES[k]);b.innerHTML=FL[k];b.onclick=()=>apply(k);bar.appendChild(b)});
  document.body.appendChild(bar);apply(cur);
 };
})();
