    var portrait=w<720||(h>w*1.05&&w<900);          // téléphone en hauteur ou fenêtre étroite : une seule page
    var pageH=Math.min(h-4,(portrait?w:w/2)/RATIO);
    return {w:pageH*RATIO,h:pageH,portrait:portrait};
  }
  function build(startIndex){
    // Nouveau conteneur à chaque (re)construction : le livre prend toute la place disponible, à la page où l'on était.
    var old=book;var fresh=document.createElement('div');fresh.id='book';fresh.setAttribute('aria-live','polite');
    if(shown)fresh.classList.add('ready');
    old.parentNode.replaceChild(fresh,old);book=fresh;
    if(flip){try{flip.destroy();}catch(e){}}
    s=size();
    book.style.width=Math.round(s.portrait?s.w:s.w*2)+'px';book.style.height=Math.round(s.h)+'px';
    if(typeof zoom==='number'&&zoom!==1)book.style.pointerEvents='none';
    pages.forEach(function(src,i){
      var d=document.createElement('div');d.className='page';
      d.dataset.density=(i===0||i===TOTAL-1)?'hard':'soft';
      var img=new Image();img.alt='Page '+(i+1);img.decoding='async';img.draggable=false;img.src=src;d.appendChild(img);book.appendChild(d);
    });
    flip=new St.PageFlip(book,{width:Math.round(s.w),height:Math.round(s.h),size:'fixed',showCover:true,flippingTime:950,usePortrait:true,startPage:0,
      maxShadowOpacity:.55,drawShadow:true,mobileScrollSupport:false,useMouseEvents:true,swipeDistance:25,clickEventForward:true,showPageCorners:true,disableFlipByClick:false,autoSize:false});
    flip.loadFromHTML(book.querySelectorAll('.page'));
    flip.on('flip',ui);flip.on('changeOrientation',ui);flip.on('init',ui);
    flip.on('changeState',function(e){if(e.data==='flipping')swish();});
    if(!shown){
      var loaded=0,gate=6;
      [].forEach.call(book.querySelectorAll('img'),function(img,i){
        function done(){loaded++;lp.value=Math.round(loaded/gate*100);if(loaded>=gate)reveal();}
        if(i>=gate)return;
        if(img.complete)done();else{img.addEventListener('load',done);img.addEventListener('error',done);}
      });
    }
    if(startIndex>0){flip.turnToPage(startIndex);}
    book.style.transition='none';centerBook(startIndex||0,true);
    ui();
  }
  function reveal(){if(shown)return;shown=true;book.classList.add('ready');loader.classList.add('done');
    setTimeout(function(){$('hint').classList.add('show');setTimeout(function(){$('hint').classList.remove('show');},5200);},900);}
  setTimeout(reveal,6000);
  // Couverture et 4e de couverture : le livre fermé se centre à l'écran au lieu de rester d'un côté.
  function centerBook(i,instant){
    var dx=0;
    if(s&&!s.portrait){if(i===0)dx=-s.w/2;else if(i>=TOTAL-1)dx=s.w/2;}
    book.style.transition=instant?'none':'transform .7s cubic-bezier(.2,.7,.2,1)';
    book.style.transform=dx?'translateX('+dx+'px)':'';
  }
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){
    var n=size();
    if(n.portrait!==s.portrait||Math.abs(n.h-s.h)>8||Math.abs(n.w-s.w)>8)build(flip.getCurrentPageIndex());
  },250);});

  function isPortrait(){return flip.getOrientation&&flip.getOrientation()==='portrait';}
  function leftIndex(){var i=flip.getCurrentPageIndex();return isPortrait()?i:(i===0?-1:(i%2===1?i:i-1));}
  function visibleIndexes(){            // index (0-based) des pages visibles
    var i=flip.getCurrentPageIndex();
    if(isPortrait()||i===0||i>=TOTAL-1)return [i];
    var l=leftIndex();return [l,l+1];
  }
  function ui(){
    var i=flip.getCurrentPageIndex(),t=T(),label;
    if(i===0)label=t.cover;
    else if(i>=TOTAL-1)label=t.back;
    else if(isPortrait())label=t.page+' <b>'+(i+1)+'</b> / '+TOTAL;
    else{var l=leftIndex();label=t.pages+' <b>'+(l+1)+'–'+(l+2)+'</b> / '+TOTAL;}
    count.innerHTML=label;
    bar.style.width=Math.round((i+1)/TOTAL*100)+'%';
    prev.disabled=i<=0;next.disabled=i>=TOTAL-1;
    centerBook(i);
    history.replaceState(null,'','#p'+(i+1)+(location.search||''));
    if($('reader').classList.contains('open'))renderReader();
  }
  prev.onclick=function(){flip.flipPrev('bottom');};
  next.onclick=function(){flip.flipNext('bottom');};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeToc();closeReader();if(document.body.classList.contains('immersive')&&!document.fullscreenElement)setImmersive(false);return;}
    if(e.key==='ArrowRight'||e.key==='PageDown'){flip.flipNext('bottom');}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){flip.flipPrev('bottom');}
    else if(e.key==='Home'){flip.turnToPage(0);}
    else if(e.key==='End'){flip.turnToPage(TOTAL-1);}
  });
  $('bar').addEventListener('click',function(e){var r=this.getBoundingClientRect();var p=Math.round((e.clientX-r.left)/r.width*(TOTAL-1));flip.flip(Math.max(0,Math.min(TOTAL-1,p)),'bottom');});

  /* ---------- Mode lecture plein écran : le livre prend toute la place ---------- */
  function setImmersive(on){
    if(document.body.classList.contains('immersive')===on)return;
    document.body.classList.toggle('immersive',on);wake();
    $('fsBtn').setAttribute('aria-pressed',on);
    requestAnimationFrame(function(){requestAnimationFrame(function(){build(flip?flip.getCurrentPageIndex():0);});});
  }
  function toggleImmersive(){
    var on=!document.body.classList.contains('immersive');
    setImmersive(on);
    var d=document.documentElement;
    try{
      if(on&&d.requestFullscreen){d.requestFullscreen().catch(function(){});}
      else if(!on&&document.fullscreenElement){document.exitFullscreen();}
    }catch(e){}
  }
  var idleTimer=0;
  function wake(){
    document.body.classList.remove('idle');clearTimeout(idleTimer);
    if(!document.body.classList.contains('immersive'))return;
    idleTimer=setTimeout(function(){if(!$('toc').classList.contains('open')&&!$('reader').classList.contains('open'))document.body.classList.add('idle');},3200);
  }
  ['pointermove','pointerdown','keydown','touchstart','wheel'].forEach(function(ev){document.addEventListener(ev,wake,{passive:true});});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&document.body.classList.contains('immersive'))setImmersive(false);});
  $('fsBtn').onclick=toggleImmersive;
  var hashStart=parseInt((location.hash.match(/p(\d+)/)||[])[1],10);
  var startAt=(hashStart>1&&hashStart<=TOTAL)?hashStart-1:0;
  // Téléphone tenu en travers : très peu de hauteur, on masque directement l'en-tête pour agrandir le livre.
  if(window.matchMedia&&window.matchMedia('(max-height:520px)').matches){document.body.classList.add('immersive');wake();}
  build(startAt);

  /* ---------- Sommaire ---------- */
  var tocEl=$('toc'),tocBtn=$('tocBtn');
  function buildToc(){
    tocEl.innerHTML='<h2>'+T().goto+'</h2>';
    TOCPAGES.forEach(function(p,k){
      var b=document.createElement('button');b.innerHTML='<span>'+T().ch[k]+'</span><i>p. '+p+'</i>';
      b.onclick=function(){closeToc();flip.flip(Math.min(TOTAL-1,p-1),'bottom');};tocEl.appendChild(b);
    });
  }
  function closeToc(){tocEl.classList.remove('open');tocBtn.setAttribute('aria-expanded','false');}
  tocBtn.onclick=function(e){e.stopPropagation();var o=tocEl.classList.toggle('open');tocBtn.setAttribute('aria-expanded',o);};
  document.addEventListener('click',function(e){if(!tocEl.contains(e.target))closeToc();});

  /* ---------- Zoom ---------- */
  var zoomBtn=$('zoomBtn'),zoom=1,pan={x:0,y:0},drag=null;
  function applyZoom(){stage.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';}
  zoomBtn.onclick=function(){
    var on=zoom===1;zoom=on?1.9:1;pan={x:0,y:0};applyZoom();
    zoomBtn.setAttribute('aria-pressed',on);document.body.classList.toggle('is-zoomed',on);
    book.style.pointerEvents=on?'none':'';prev.style.display=next.style.display=on?'none':'';
  };
  stage.addEventListener('pointerdown',function(e){if(zoom===1)return;drag={x:e.clientX-pan.x,y:e.clientY-pan.y};stage.setPointerCapture(e.pointerId);});
  stage.addEventListener('pointermove',function(e){if(!drag)return;var lim=Math.max(main.clientWidth,main.clientHeight)*.6;
    pan.x=Math.max(-lim,Math.min(lim,e.clientX-drag.x));pan.y=Math.max(-lim,Math.min(lim,e.clientY-drag.y));applyZoom();});
  stage.addEventListener('pointerup',function(){drag=null;});
  stage.addEventListener('wheel',function(e){if(zoom===1)return;e.preventDefault();zoom=Math.max(1.2,Math.min(3.2,zoom*(e.deltaY<0?1.1:.9)));applyZoom();},{passive:false});

  /* ---------- Son : vrai bruit de page qui se tourne ---------- */
  var sound=true;try{sound=localStorage.getItem('nv-agenda-sound')!=='off';}catch(e){}
  var soundBtn=$('soundBtn');soundBtn.setAttribute('aria-pressed',sound);
  var actx=null,buffers=[],loadingSound=false;
  function initAudio(){
    if(actx||loadingSound)return;loadingSound=true;
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;return;}
    ['audio/page-turn-1.mp3','audio/page-turn-2.mp3','audio/page-turn-3.mp3'].forEach(function(u){
      fetch(u).then(function(r){return r.arrayBuffer();}).then(function(b){return new Promise(function(ok,ko){actx.decodeAudioData(b,ok,ko);});})
        .then(function(buf){buffers.push(buf);}).catch(function(){});
    });
  }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function once(){if(sound)initAudio();if(actx&&actx.state==='suspended')actx.resume();},{passive:true});});
  var lastBuf=-1,lastAt=0;
  function swish(){
    if(!sound||!actx||!buffers.length)return;
    var now=performance.now();if(now-lastAt<180)return;lastAt=now;
    if(actx.state==='suspended')actx.resume();
    var k;do{k=Math.floor(Math.random()*buffers.length);}while(buffers.length>1&&k===lastBuf);lastBuf=k;
    var src=actx.createBufferSource();src.buffer=buffers[k];src.playbackRate.value=.94+Math.random()*.14;
    var g=actx.createGain();g.gain.value=.85;src.connect(g);g.connect(actx.destination);src.start();
  }
  soundBtn.onclick=function(){
    sound=!sound;soundBtn.setAttribute('aria-pressed',sound);try{localStorage.setItem('nv-agenda-sound',sound?'on':'off');}catch(e){}
    if(sound){initAudio();if(actx&&actx.state==='suspended')actx.resume();setTimeout(swish,120);}
  };

  /* ---------- Lecteur de texte (traduction) ---------- */
  var textCache={};
  function loadTexts(l){
    if(textCache[l])return Promise.resolve(textCache[l]);
    return fetch('texts/'+l+'.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){textCache[l]=j;return j;}).catch(function(){textCache[l]={};return textCache[l];});
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var reader=$('reader');
  function renderReader(){
    var t=T(),idx=visibleIndexes();
    Promise.all([loadTexts(lang),loadTexts('fr')]).then(function(res){
      var tr=res[0],fr=res[1];
      $('readerTitle').innerHTML=esc(t.readerTitle)+'<small>'+esc(t.readerSub)+'</small>';
      $('rPages').innerHTML=idx.map(function(i){return '<img src="'+pages[i]+'" alt="'+t.page+' '+(i+1)+'">';}).join('');
      var html='';
      if(lang!=='fr'&&t.machine)html+='<span class="note">'+esc(t.machine)+'</span>';
      idx.forEach(function(i){
        var key=String(i+1),own=tr[key],orig=fr[key]||'',txt=(lang==='fr'?orig:own),missing=false;
        if(lang!=='fr'&&!own&&orig){txt=orig;missing=true;}
        html+='<section><h3>'+esc(t.pageLbl)+' '+(i+1)+'</h3>';
        if(!txt)html+='<p class="muted">'+esc(t.noText)+'</p>';
        else{
          if(missing)html+='<p class="muted">'+esc(t.notTrans)+'</p>';
          txt.split('\n').forEach(function(par,n){if(par.trim())html+='<p'+(n===0&&par.length<90?' class="first"':'')+'>'+esc(par)+'</p>';});
        }
        html+='</section>';
      });
      $('rText').innerHTML=html;$('rText').scrollTop=0;
    });
  }
  function openReader(){reader.classList.add('open');renderReader();}
  function closeReader(){reader.classList.remove('open');}
  $('readBtn').onclick=openReader;$('rClose').onclick=closeReader;
  reader.addEventListener('click',function(e){if(e.target===reader)closeReader();});
  $('rPrev').onclick=function(){var i=flip.getCurrentPageIndex();var target=isPortrait()?i-1:(i<=1?0:leftIndex()-2);flip.turnToPage(Math.max(0,target));ui();};
  $('rNext').onclick=function(){var i=flip.getCurrentPageIndex();var target=isPortrait()?i+1:(i===0?1:leftIndex()+2);flip.turnToPage(Math.min(TOTAL-1,target));ui();};

  /* ---------- Application de la langue (interface + drapeaux) ---------- */
  function applyLang(){
    var t=T();
    document.documentElement.lang=lang;document.title=t.title;
    $('subtitle').textContent=t.sub;$('tocLbl').textContent=t.toc;$('readLbl').textContent=t.read;$('zoomLbl').textContent=t.zoom;$('soundLbl').textContent=t.sound;$('fsLbl').textContent=t.fs;
    $('hint').textContent=t.hint;prev.setAttribute('aria-label',t.prev);next.setAttribute('aria-label',t.next);
    $('rClose').setAttribute('aria-label',t.close);$('readBtn').title=t.read;
    [].forEach.call($('langs').children,function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang);});
    buildToc();if(flip.getCurrentPageIndex!==undefined&&shown)ui();
    if(reader.classList.contains('open'))renderReader();
  }
  LANGS.forEach(function(l){
    var b=document.createElement('button');b.type='button';b.dataset.lang=l;b.innerHTML=FLAGS[l];b.title=NAMES[l];b.setAttribute('aria-label',NAMES[l]);
    b.onclick=function(){
      if(l===lang)return;lang=l;try{localStorage.setItem('nv-agenda-lang',l);}catch(e){}
      applyLang();
      if(l!=='fr')openReader();else closeReader();     // en changeant de langue, le texte traduit s'affiche tout de suite
    };
    $('langs').appendChild(b);
  });
  applyLang();
  loadTexts(lang);
})();
</script>
</body>
</html>
