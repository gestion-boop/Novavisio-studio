<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pauline Segura · Conseillère immobilier · Immosphera</title>
<meta name="description" content="Pauline Segura, conseillère immobilier chez Immosphera à Narbonne.">
<meta name="robots" content="noindex">
<style>
:root{--ink:#0f0f0f;--card:#171717;--line:rgba(233,186,110,.25);--gold:#e2ad5c;--gold2:#f6c97f;--ivory:#f4eee4;--mute:#a59d90;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 30%,#1d1a14 0%,#0f0f0f 60%);color:var(--ivory);font:300 16px/1.6 var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
header{text-align:center}
header .brand{font:500 13px var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
header .sub{margin-top:6px;font:italic 400 16px var(--serif);color:var(--mute)}
.card{width:min(560px,100%);margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 26px 30px;text-align:center}
.badge{width:min(330px,80%);height:auto;margin:0 auto}
h1{margin-top:22px;font:400 clamp(30px,6vw,40px)/1.1 var(--serif);color:var(--ivory)}
.role{margin-top:8px;font:500 11px var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.agency{margin-top:14px;font:italic 400 16px var(--serif);color:var(--mute)}
.contacts{margin-top:26px;display:grid;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 20px;border-radius:999px;font:500 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:.3s}
.btn.p{background:linear-gradient(115deg,#9c6b2c,#e8b462 40%,#fde0a6 55%,#e2ad5c 75%,#8f6227);color:#141008}
.btn.o{border:1px solid var(--line);color:var(--gold2)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}
.line{margin-top:6px;font:400 14px var(--sans);color:var(--mute)}
footer{margin-top:26px;font:400 12px var(--sans);letter-spacing:.06em;color:#6f695f;text-align:center}
</style>
</head>
<body>
<header>
 <div class="brand">Immosphera</div>
 <div class="sub">Visitez autrement · Agence immobilière à Narbonne</div>
</header>

<main class="card">
 <img class="badge" src="assets/img/pauline-badge.png" alt="Pauline Segura, conseillère immobilier">
 <h1>Pauline Segura</h1>
 <div class="role">Conseillère immobilier</div>
 <div class="agency">Immosphera · 19 rue du Luxembourg, 11100 Narbonne</div>

 <div class="contacts">
  <a class="btn p" href="tel:+33762341078">
   <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
   Appeler · +33 7 62 34 10 78
  </a>
  <a class="btn o" href="mailto:pauline.s@immosphera.fr">
   <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
   Envoyer un e-mail
  </a>
  <a class="btn o" href="https://www.immosphera.fr/" target="_blank" rel="noopener">Site Immosphera</a>
 </div>
 <div class="line">pauline.s@immosphera.fr</div>
</main>

<footer>© Immosphera · Agence immobilière à Narbonne</footer>
</body>
</html>
