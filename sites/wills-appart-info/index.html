<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Will's Appart · Narbonne</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#5a4630;--mut:#8a7560;--gold:#b8924a;--line:#ead9b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fffdf9f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{height:44px;width:auto}
.langs{margin-left:auto;display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:20px;line-height:1.2;cursor:pointer}
.langs button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px #b8924a44}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#fffdf9;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);background:#f3ead8;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
main{max-width:820px;margin:0 auto;padding:16px}
.hero{border:2px solid var(--gold);border-radius:14px;background:#fff;padding:22px 18px;margin-bottom:14px;text-align:center}
.hero img{display:block;width:180px;max-width:55%;height:auto;margin:0 auto 10px}
.hero h1{margin:0;font-size:24px;font-weight:700;color:var(--gold)}
section{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 16px;scroll-margin-top:110px}
.head{display:flex;align-items:center;gap:10px;background:#fffdf9;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.dot{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:var(--gold);opacity:.8}
h2{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box p{margin:0 0 12px}
.box p:last-child{margin-bottom:0}
.cards{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 6px #5a463014;min-width:0}
a.card:hover{border-color:var(--gold)}
.ico{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.ico svg{width:22px;height:22px;fill:#fff}
.ico svg.stroke{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.card small{display:block;color:var(--mut);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.cols{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.cols h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
ul{margin:0;padding-left:18px}
li{margin:4px 0;font-size:15px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:14px}
@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  header img{height:38px}
}
</style>
</head>
<body>
<header><img src="logo.png" alt="Will's Appart"><div class="langs" id="langs" role="group"></div></header>
<nav id="nav"></nav>
<main id="app"><p style="text-align:center;color:#8a7560">…</p></main>
<footer>Will's Hôtel · 23 avenue Pierre Sémard · 11100 Narbonne</footer>
<script>
const FLAG={fr:'🇫🇷',en:'🇬🇧',es:'🇪🇸',de:'🇩🇪',nl:'🇳🇱'};
const NAME={fr:'Français',en:'English',es:'Español',de:'Deutsch',nl:'Nederlands'};
// Icônes par ordre des boutons (téléphone, téléphone, email, site, réserver, avis, livret, instagram, facebook)
const ICONS=[
 '<path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>',
 '<path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>',
 '<path d="M3 5h18v14H3z" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 6l9 7 9-7" fill="none" stroke="#fff" stroke-width="2"/>',
 '<circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3.5 12h17M12 3.5c3 3.2 3 13.8 0 17M12 3.5c-3 3.2-3 13.8 0 17" fill="none" stroke="#fff" stroke-width="1.6"/>',
 '<path d="M6 3h12v18l-6-4-6 4z"/>',
 '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
 '<rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 9h8M8 13h8" stroke="#fff" stroke-width="2"/>',
 '<rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17" cy="7" r="1.2"/>',
 '<path d="M14 8V6c0-.8.4-1.3 1.3-1.3H17V2h-2.6C11.9 2 10.8 3.6 10.8 6v2H8v3h2.8v11h3.2V11h2.6l.4-3z"/>'
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const q=new URLSearchParams(location.search);
let D=null,langs=[],cur='fr';

function render(){
  const L=D.languages[cur];
  document.documentElement.lang=cur;
  document.title=L.title;
  document.getElementById('langs').innerHTML=langs.length>1?langs.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===cur}" title="${NAME[l]}" aria-label="${NAME[l]}">${FLAG[l]}</button>`).join(''):'';
  document.getElementById('nav').innerHTML=L.sections.map((s,i)=>`<a href="#s${i}">${esc(s.title)}</a>`).join('');
  const body=L.sections.map((s,i)=>{
    let inner='';
    if(s.kind==='text'){
      inner='<div class="box">'+s.items.map(p=>`<p>${rich(p)}</p>`).join('')+'</div>';
    }else if(s.kind==='buttons'){
      inner='<div class="cards">'+s.items.map((b,k)=>{
        const icon=`<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS[3]}</svg></span>`;
        const inside=`${icon}<span><b>${esc(b.t)}</b><small>${esc(b.s)}</small></span>`;
        return b.u
          ? `<a class="card" href="${esc(b.u)}"${b.u.startsWith('http')?' target="_blank" rel="noopener"':''}>${inside}</a>`
          : `<div class="card">${inside}</div>`;
      }).join('')+'</div>';
    }else if(s.kind==='columns'){
      inner='<div class="box"><div class="cols">'+s.items.map(c=>`<div><h3>${esc(c.t)}</h3><ul>${c.items.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></div>`).join('')+'</div></div>';
    }
    return `<section id="s${i}"><div class="head"><span class="dot"></span><h2>${esc(s.title)}</h2></div>${inner}</section>`;
  }).join('');
  document.getElementById('app').innerHTML=`<div class="hero"><img src="intro-logo.png" alt="Will's Appart"><h1>${esc(L.title)}</h1></div>${body}`;
}

async function init(){
  try{
    const r=await fetch('content.json',{cache:'no-cache'});
    D=await r.json();
  }catch{
    document.getElementById('app').innerHTML='<p>Contenu indisponible.</p>';
    return;
  }
  langs=Object.keys(D.languages).filter(l=>FLAG[l]);
  let saved=null;try{saved=localStorage.getItem('nv-lang');}catch{}
  const want=q.get('lang');
  cur=langs.includes(want)?want:(langs.includes(saved)?saved:(langs[0]||'fr'));
  render();
}
document.getElementById('langs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-l]');if(!b)return;
  cur=b.dataset.l;try{localStorage.setItem('nv-lang',cur);}catch{}
  render();
});
init();
</script>
</body>
</html>
