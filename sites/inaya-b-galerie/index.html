<title>Inaya.B – Galerie</title>
<meta name="description" content="Galerie photo d'Inaya.B, bijoux et accessoires féminins à Narbonne, place des 4 Fontaines.">
<link rel="icon" href="assets/img/logo.png">
<style>
:root{--t:#a04c34;--td:#7a3a28;--cream:#f6ead9;--ink:#3a2a22;--muted:#7d6558}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#fcf3e8 0%,#f3e2cf 55%,#e9cfb5 100%) fixed;line-height:1.55;overflow-x:clip}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{text-align:center;padding:44px 0 28px}
.logo{width:min(46vw,210px);height:auto;border-radius:50%;margin:0 auto 18px;box-shadow:0 14px 34px rgba(120,60,40,.28),0 0 0 5px rgba(160,76,52,.16)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(1.6rem,4.6vw,2.6rem);color:var(--td);letter-spacing:.02em}
.sub{color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;margin-top:6px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.tags span{padding:6px 14px;border-radius:99px;background:rgba(160,76,52,.1);color:var(--td);font-weight:600;font-size:.86rem}
.info{margin-top:18px;color:var(--muted);font-size:.93rem}
.info a{color:var(--td);font-weight:700;text-decoration:none}
.gal{columns:4 230px;column-gap:14px;padding:14px 0 54px}
.p{break-inside:avoid;margin:0 0 14px;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#e9cfb5;box-shadow:0 8px 22px rgba(120,60,40,.16);position:relative}
.p img{width:100%;height:auto;transition:transform .5s}
.p:hover img{transform:scale(1.04)}
.p:focus-visible{outline:3px solid var(--t);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 18px 40px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(40,22,16,.94);display:grid;place-items:center;padding:60px 64px}
.lb[hidden]{display:none}
.lb img{max-height:84vh;max-width:100%;border-radius:12px;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:1.8rem;cursor:pointer;line-height:1}
.lb button:hover{background:var(--t)}
.lb-x{top:14px;left:50%;transform:translateX(-50%)}
.lb-p{left:12px;top:50%}.lb-n{right:12px;top:50%}
@media(max-width:600px){.lb{padding:64px 8px}.lb-p,.lb-n{top:auto;bottom:14px}}
</style>
</head>

<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lbx" aria-label="Fermer">×</button>
  <button class="lb-p" id="lbp" aria-label="Précédent">‹</button>
  <button class="lb-n" id="lbn" aria-label="Suivant">›</button>
  <img id="lbi" alt="">
</div>
<script>
{
  const g=[...document.querySelectorAll('.p')],lb=document.getElementById('lb'),li=document.getElementById('lbi');let k=0;
  const show=n=>{k=(n+g.length)%g.length;const im=g[k].querySelector('img');li.src=im.src;li.alt=im.alt;lb.hidden=false};
  g.forEach((f,i)=>{f.addEventListener('click',()=>show(i));f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(i)}})});
  document.getElementById('lbx').onclick=()=>lb.hidden=true;document.getElementById('lbp').onclick=()=>show(k-1);document.getElementById('lbn').onclick=()=>show(k+1);
  lb.addEventListener('click',e=>{if(e.target===lb)lb.hidden=true});
  document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
}
</script>
