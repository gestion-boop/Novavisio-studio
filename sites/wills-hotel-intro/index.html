<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Will's Hôtel · Intro</title>
<style>
html,body{margin:0;height:100%;background:#120d0b;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#fff}
.stage{position:fixed;inset:0;overflow:hidden}
.bg{position:absolute;inset:-6%;background:url(hero.jpg) center/cover no-repeat;opacity:0;animation:bg 6s ease-out forwards;filter:saturate(1.05)}
@keyframes bg{0%{opacity:0;transform:scale(1.02)}18%{opacity:1}100%{opacity:1;transform:scale(1.16) translate(-1.2%,-.8%)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(18,13,11,.15),rgba(18,13,11,.78)),linear-gradient(transparent 45%,rgba(18,13,11,.65))}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{width:min(260px,52vw);background:rgba(255,252,246,.94);border-radius:18px;padding:14px 22px;box-shadow:0 14px 50px #0008;opacity:0;transform:translateY(14px) scale(.96);animation:rise .9s .7s cubic-bezier(.2,.7,.2,1) forwards}
.logo img{display:block;width:100%;height:auto}
h1{margin:26px 0 8px;font-weight:400;font-size:clamp(26px,5.4vw,48px);letter-spacing:.02em;text-shadow:0 3px 24px #000a;opacity:0;transform:translateY(12px);animation:rise .9s 1.5s cubic-bezier(.2,.7,.2,1) forwards}
.line{width:0;height:2px;background:linear-gradient(90deg,transparent,#e6c98a,transparent);animation:line 1s 2.2s ease-out forwards}
@keyframes line{to{width:min(240px,50vw)}}
p{margin:14px 0 0;font-size:clamp(14px,2.6vw,19px);letter-spacing:.08em;text-transform:uppercase;color:#f1e6cf;text-shadow:0 2px 14px #000a;opacity:0;animation:rise .9s 2.6s ease-out forwards}
@keyframes rise{to{opacity:1;transform:none}}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:#e6c98a;animation:bar 6s linear forwards}
@keyframes bar{to{width:100%}}
@media (prefers-reduced-motion:reduce){.bg{animation:none;opacity:1}.logo,h1,p{animation-duration:.01s;animation-delay:0s}.line{animation-duration:.01s;animation-delay:0s}.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="stage" aria-label="Will's Hôtel Narbonne">
  <div class="bg"></div><div class="shade"></div>
  <div class="content">
    <div class="logo"><img src="logo.png" alt="Will's Hôtel"></div>
    <h1 id="t"></h1><div class="line"></div><p id="s"></p>
  </div>
  <div class="bar"><i></i></div>
</div>
<script>
const L={
 fr:["Bienvenue au Will’s Hôtel","Narbonne · entre la gare et le centre-ville"],
 en:["Welcome to Will’s Hotel","Narbonne · between the station and the town centre"],
 es:["Bienvenido al Will’s Hôtel","Narbona · entre la estación y el centro"],
 de:["Willkommen im Will’s Hôtel","Narbonne · zwischen Bahnhof und Stadtzentrum"],
 nl:["Welkom bij Will’s Hôtel","Narbonne · tussen station en centrum"]
};
const q=new URLSearchParams(location.search).get('lang');
const nav=(navigator.language||'fr').slice(0,2).toLowerCase();
const k=L[q]?q:(L[nav]?nav:'fr');
document.documentElement.lang=k;
document.getElementById('t').textContent=L[k][0];
document.getElementById('s').textContent=L[k][1];
</script>
</body>
</html>
