<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2a2622;--mut:#6f665c;--acc:#8c2f39;--line:#e4dccf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fffdf9ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header img{height:34px;width:auto}
.langs{margin-left:auto;display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:20px;line-height:1.2;cursor:pointer}
.langs button[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px #8c2f3933}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#fffdf9;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);background:#f0e9dc;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
.hero{border-radius:16px;overflow:hidden;margin-bottom:14px;position:relative}
.hero img{display:block;width:100%;height:auto}
.hero h1{position:absolute;left:0;right:0;bottom:0;margin:0;padding:34px 16px 14px;color:#fff;font-size:24px;background:linear-gradient(transparent,#000a)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;scroll-margin-top:110px}
h2{margin:0 0 10px;font-size:19px;color:var(--acc)}
h3{margin:12px 0 4px;font-size:16px}
ul{margin:6px 0;padding-left:20px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row small{color:var(--mut);display:block}
.price{white-space:nowrap;font-weight:700;color:var(--acc)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.pics img{width:100%;border-radius:10px;display:block}
.btn{display:inline-block;margin:8px 8px 0 0;background:var(--acc);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700}
.btn.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.muted{color:var(--mut);font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:14px}
</style>
</head>

  <section id="apt"><h2>${esc(t.apH)}</h2><div class="pics"><img src="appart.jpg" alt=""></div><p>${esc(t.ap)}</p><p class="muted">${esc(t.apTax)}</p></section>
  <section id="tour"><h2>${esc(t.tourH)}</h2><div class="pics"><img src="horreum.jpg" alt=""><img src="narbovia.jpg" alt=""><img src="palais.jpg" alt=""></div><p>${esc(t.tour)}</p><ul>${t.spots.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><a class="btn alt" href="https://www.narbonne-tourisme.com/" target="_blank" rel="noopener">${esc(t.tourist)}</a></section>
  <section id="part"><h2>${esc(t.partH)}</h2><ul>${t.part.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>
  <section id="contact"><h2>${esc(t.contH)}</h2><p><b>Will’s Hôtel</b><br>${esc(t.addr)}</p><a class="btn" href="tel:+33645981880">${esc(t.call)} 06 45 98 18 80</a><a class="btn alt" href="tel:+33468322628">04 68 32 26 28</a><a class="btn alt" href="mailto:contact@willshotelnarbonne.fr">${esc(t.mail)}</a><a class="btn alt" href="https://willshotelnarbonne.fr/wp-content/uploads/2026/03/Wills-HOTEL.pdf" target="_blank" rel="noopener">${esc(t.pdf)}</a></section>`;
}
document.getElementById('langs').addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(!b)return;cur=b.dataset.l;try{localStorage.setItem('nv-lang',cur);}catch{}render();});
render();
